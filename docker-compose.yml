services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: webmedia
      DB_USERNAME: webmedia
      DB_PASSWORD: webmedia
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MARIADB_DATABASE: webmedia
      MARIADB_USER: webmedia
      MARIADB_PASSWORD: webmedia
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  caddy_data:
  caddy_config:
  db_data:
