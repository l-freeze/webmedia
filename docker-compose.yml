services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/app
      - ./.docker/caddy/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: webmedia
      DB_USERNAME: webmedia
      DB_PASSWORD: webmedia
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine3.22
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: webmedia
      POSTGRES_USER: webmedia
      POSTGRES_PASSWORD: webmedia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmedia -d webmedia"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
